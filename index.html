<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treact</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
      integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p"
      crossorigin="anonymous"
    />

    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Navigation -->
    <nav>
      <div class="logo-container">
        <img
          src="assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
          alt="Treact Logo"
          class="T-logo"
        />
        <span class="logo-text">Treact</span>
      </div>

      <div class="burger-menu">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#blog">Blog</a></li>
          <li><a href="#pricing">Pricing</a></li>
          <li><a href="#contactus">Contact Us</a></li>
          <li><a href="#login">Login</a></li>
          <li>
            <a href="#signup" class="button-link">Sign Up</a>
          </li>
        </ul>
      </div>
    </nav>


    <!-- Mobile Menu Modal -->
    <div class="modal">
      <button
        type="button"
        class="btn__menu btn__menu--close"
        onclick="closeMenu()"
        aria-label="Close menu"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal__links">
        <a href="#about" class="modal__link">About</a>
        <a href="#blog" class="modal__link">Blog</a>
        <a href="#pricing" class="modal__link">Pricing</a>
        <a href="#contactus" class="modal__link">Contact Us</a>
        <a href="#login" class="modal__link">Login</a>
        <a href="#signup" class="modal__link modal__link--primary"> Sign Up </a>
      </div>
    </div>

    <!-- Header / About -->
    <header id="about">
      <div class="container">
        <div class="row">
          <div class="text-container">
          <h1>Beautiful React Templates<span class="colored-word"> for you.</span></h1>
          <p class="side-paragraph">
            Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
          </div>
            <img src="assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="design-logo" class="side-image">
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Features -->
      <section id="features">
        <div class="container">
          <div class="row__narrow">
            <!-- Enter Features Section -->
          </div>
        </div>
      </section>

      <!-- Quality Work -->
      <section id="quality">
        <div class="container">
          <div class="row">
            <!-- Enter Quality Work Section -->
          </div>
        </div>
      </section>

      <!-- Steps -->
      <section id="steps">
        <div class="container">
          <div class="row">
            <!-- Enter Steps Section -->
          </div>
        </div>
      </section>

      <!-- Values -->
      <section id="values">
        <div class="container">
          <div class="row">
            <!-- Enter Values Section -->
          </div>
        </div>
      </section>

      <!-- Pricing -->
      <section id="pricing">
        <div class="container">
          <div class="row">
            <!-- Enter Pricing Section -->
          </div>
        </div>
      </section>

      <!-- Testimonials -->
      <section id="testimonials">
        <div class="container">
          <div class="row">
            <!-- Enter Testimonials Section -->
          </div>
        </div>
      </section>

      <!-- Call to Action -->
      <section id="start">
        <div class="container">
          <div class="row">
            <!-- Enter "Start"/Call to Action Section -->
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="row footer__row">
        <!-- Enter Footer -->
      </div>
    </footer>
  </body>
</html>
